[project]
name = "eds-order-intake"
version = "0.1.0"
description = "Image -> field extraction -> Microsoft Graph -> Planner task"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "azure-identity>=1.17.0",
    # azure-identity's async credentials need an aiohttp transport.
    "aiohttp>=3.9.0",
    "openai>=1.40.0",
    "rapidfuzz>=3.9.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
# Only needed by the "ocr_llm" extractor.
ocr = [
    "azure-ai-documentintelligence>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
eds-order-intake = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
