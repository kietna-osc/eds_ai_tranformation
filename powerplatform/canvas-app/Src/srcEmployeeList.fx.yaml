        =Set(varActiveTab, "employee");Set(varShowPageSize, false);Set(varHeaderTitle, "社員管理");Set(varHeaderSubtitle, "社員情報の管理と編集");Set(gblPage, 1);Set(varShowEmpFilter, false);Set(varEmpQId, "");Set(varEmpQName, "");Set(varEmpQMail, "");Set(varEmpQDept, "");Set(varEmpDDept, "");Set(varShowEmpFDeptList, false);Set(varShowEmpMFDeptList, false);Set(varEmpQCreFrom, "");Set(varEmpQCreTo, "");Set(varEmpQUpdFrom, "");Set(varEmpQUpdTo, "");Set(varEmpQActive, false);Set(varEmpQInactive, false);Set(varEmpDActive, false);Set(varEmpDInactive, false);Set(varEmpDCreFromT, "");Set(varEmpDCreToT, "");Set(varEmpDUpdFromT, "");Set(varEmpDUpdToT, "");Set(varEmpTimeTgt, "");Set(varShowEmpModal, false);Set(varEmpMode, "create");Set(varEmpEditId, "");
        Set(varEmpSearch, Trim(Coalesce(txtEmpSearch.Text, txtEmpMSearch.Text)));
        // 社員一覧の取得 (検索語の有無で取得方法が変わる。下記参照)
        Set(varEmpLoading, true);
        // 検索語があればサーバー側で絞り込み (社員番号・氏名・Eメール・部署)。ページングもサーバー側
        Set(varEmpRaw, IfError(Substitute('EDS-APIManagement1'.Run("employee", "{""page"":" & gblPage & ",""pageSize"":" & gblPageSize & If(IsBlank(varEmpSearch), "", ",""search_keyword"":" & JSON(varEmpSearch) & ",""tz_offset"":" & TimeZoneOffset()) & "}", "employeeList").response, ":null", ":"""""), ""));
        If(
            IsBlank(varEmpRaw) || Left(varEmpRaw, 8) = "{""error""",
            Notify("社員一覧の取得に失敗しました", NotificationType.Error); Clear(colEmployees); Set(varEmpTotal, 0),
            ClearCollect(colEmployees, ForAll(Table(ParseJSON(varEmpRaw).value) As emp, {no:Value(emp.Value.employee_id), empId:Text(emp.Value.employee_code), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:If(Boolean(emp.Value.is_active), "Active", "Inactive"), created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))})); Set(varEmpTotal, Value(ParseJSON(varEmpRaw).totalCount))
        );
        Set(varEmpLoading, false)

