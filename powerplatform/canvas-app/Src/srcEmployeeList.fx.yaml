                ItemHoverFill: =RGBA(245, 245, 245, 1)
                Items: =ThisItem.Attachments
                ItemSpacing: =4
                MaxAttachments: =1
                NoAttachmentsColor: =RGBA(0, 0, 0, 0)
                NoAttachmentsText: =""
                OnAddFile: |-
                    =If(
                        IsEmpty(attEmpCsv.Attachments),
                        Set(varShowEmpImportErrorFile, false);
                        Set(varEmpImportErrorText, "");
                        Set(varNotifyErrorMessage, "インポートするCSVファイルを選択してください");
                        Set(varEmpImportPopupMessage, "インポートするCSVファイルを選択してください");
                        Set(varEmpImportPopupActive, true);
                        Set(varShowEmpInsertSuccess, false);
                        Set(varShowNotifyFailed, true),
                        !EndsWith(Lower(First(attEmpCsv.Attachments).Name), ".csv"),
                        Set(varShowEmpImportErrorFile, false);
                        Set(varEmpImportErrorText, "");
                        Set(varNotifyErrorMessage, "CSVファイル (.csv) を選択してください");
                        Set(varEmpImportPopupMessage, "CSVファイル (.csv) を選択してください");
                        Set(varEmpImportPopupActive, true);
                        Set(varShowEmpInsertSuccess, false);
                        Set(varShowNotifyFailed, true);
                        ResetForm(frmEmpCsv),
                        Set(varEmpLoading, true);
                        Set(varShowEmpImportErrorFile, false);
                        Set(varEmpImportErrorText, "");
                        Set(varNotifyErrorMessage, "インポートに失敗しました。時間をおいて再度お試しください。");
                        Set(varShowEmpInsertSuccess, false);
                        Set(varShowNotifyFailed, false);
                        Set(varEmpImportPopupMessage, "");
                        Set(varEmpImportPopupActive, false);
                        IfError(
                            With(
                                {res: IfError('EDS-EmployeeImport'.Run({contentBytes: First(attEmpCsv.Attachments).Value, name: First(attEmpCsv.Attachments).Name}), Blank())},
                                If(
                                    IsBlank(res),
                                    Set(varEmpImportPopupMessage, "インポートに失敗しました。時間をおいて再度お試しください。");
                                    Set(varEmpImportPopupActive, true);
                                    Set(varShowNotifyFailed, true);
                                    ResetForm(frmEmpCsv),
                                    With(
                                        {topSuccess: IfError(Text(res.success_num), Blank()), topError: With({e: IfError(Text(res.error), Blank()), ef: IfError(Text(res.errorFile), Blank())}, If(!(IsBlank(e) || Lower(Trim(e)) = "null"), e, ef)), nestedSuccess: IfError(Text(ParseJSON(Text(res.response)).success_num), Blank()), nestedError: With({e: IfError(Text(ParseJSON(Text(res.response)).error), Blank()), ef: IfError(Text(ParseJSON(Text(res.response)).errorFile), Blank())}, If(!(IsBlank(e) || Lower(Trim(e)) = "null"), e, ef))},
                                        With(
                                            {successNum: Coalesce(topSuccess, nestedSuccess, "0"), errorText: If(!(IsBlank(topError) || Lower(Trim(topError)) = "null"), topError, nestedError)},
                                            If(
                                            IsBlank(errorText) || Trim(errorText) = "" || Lower(Trim(errorText)) = "null",
                                            Set(varEmpSuccessTitle, "インポートが完了しました");
                                            Set(varEmpSuccessMessage, Text(successNum) & "名の従業員を追加しました。");
                                            Set(varEmpImportPopupMessage, Text(successNum) & "名の従業員を追加しました。");
                                            Set(varEmpImportPopupActive, true);
                                            Set(varShowNotifyFailed, false);
                                            Set(varShowEmpInsertSuccess, true);
                                            ResetForm(frmEmpCsv);
                                            Set(gblPage, 1);
                                            Set(varEmpRaw, IfError(Substitute('EDS-APIManagement1'.Run("employee", "{""page"":1,""pageSize"":" & gblPageSize & If(IsBlank(varEmpSearch), "", ",""search_keyword"":" & JSON(varEmpSearch)) & "}", "employeeList").response, ":null", ":"""""), ""));
                                    If(!(IsBlank(varEmpRaw) || Left(varEmpRaw, 8) = "{""error"""), ClearCollect(colEmployees, ForAll(Table(ParseJSON(varEmpRaw).value) As emp, {no:0, empId:Text(emp.Value.employee_id), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:"", created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))})); Set(varEmpTotal, Value(ParseJSON(varEmpRaw).totalCount))),
                                            Set(varEmpImportErrorText, errorText);
                                            Set(varShowEmpImportErrorFile, true);
                                            Set(varNotifyErrorMessage, "インポートが完了しました。" & Text(successNum) & "名の従業員を追加しました。データエラーにより" & Text(CountRows(Filter(Split(Substitute(errorText, Char(13), ""), Char(10)) As errorLine, !IsBlank(Trim(errorLine.Value)) && Left(Trim(errorLine.Value), 6) <> """line"""))) & "行をスキップしました。");
                                            Set(varEmpImportPopupMessage, varNotifyErrorMessage);
                                            Set(varEmpImportPopupActive, true);
                                            Set(varShowEmpInsertSuccess, false);
                                            Set(varShowNotifyFailed, true);
                                            ResetForm(frmEmpCsv);
                                            Set(gblPage, 1);
                                            Set(varEmpRaw, IfError(Substitute('EDS-APIManagement1'.Run("employee", "{""page"":1,""pageSize"":" & gblPageSize & If(IsBlank(varEmpSearch), "", ",""search_keyword"":" & JSON(varEmpSearch)) & "}", "employeeList").response, ":null", ":"""""), ""));
                                    If(!(IsBlank(varEmpRaw) || Left(varEmpRaw, 8) = "{""error"""), ClearCollect(colEmployees, ForAll(Table(ParseJSON(varEmpRaw).value) As emp, {no:0, empId:Text(emp.Value.employee_id), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:"", created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))})); Set(varEmpTotal, Value(ParseJSON(varEmpRaw).totalCount)))
                                            )
                                        )
                                    )
                                )
                            ),
                            Set(varShowEmpImportErrorFile, false);
                            Set(varEmpImportErrorText, "");
                            Set(varNotifyErrorMessage, "インポートに失敗しました。時間をおいて再度お試しください。");
                            Set(varEmpImportPopupMessage, "インポートに失敗しました。時間をおいて再度お試しください。");
                            Set(varEmpImportPopupActive, true);
                            Set(varShowEmpInsertSuccess, false);
                            Set(varShowNotifyFailed, true);
                            ResetForm(frmEmpCsv)
                        );
                        Set(varEmpLoading, false)
                    )
