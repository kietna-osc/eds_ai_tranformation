        Set(varHistSearch, Trim(Coalesce(txtHistSearch.Text, txtHistMSearch.Text)));
        // 履歴の取得
        //   検索語なし: サーバー側ページング (page = gblPage, pageSize = gblPageSize)
        //   検索語あり: サーバー側で絞り込み (伝票番号・受取人・処理状況・データ区分・通知日時) してページング
        Set(varHistLoading, true);
        Set(varHistRaw, IfError(Substitute('EDS-APIManagement1'.Run("history", "{""page"":" & gblPage & ",""pageSize"":" & gblPageSize & If(IsBlank(varHistSearch), "", ",""search_keyword"":" & JSON(varHistSearch) & ",""tz_offset"":" & TimeZoneOffset()) & "}", "historyList").response, ":null", ":"""""), ""));
        If(
            IsBlank(varHistRaw) || Left(varHistRaw, 8) = "{""error""",
            Notify("履歴の取得に失敗しました", NotificationType.Error); Clear(colHistory); Set(varHistTotal, 0),
            ClearCollect(colHistory, ForAll(Table(ParseJSON(varHistRaw).value) As h, {no:Value(h.Value.history_id), dataType:If(Text(h.Value.status) = "Identified", "受取人指定あり", "受取人不明"), slip:Text(h.Value.slip_no), item:Text(h.Value.sender_content), sender:Text(h.Value.sender_name), senderAddr:Text(h.Value.sender_address), recipient:If(Text(h.Value.recipient_name) = "", "不明", Text(h.Value.recipient_name)), dept:Text(h.Value.recipient_department_name), deliveredAt:If(Text(h.Value.notified_at) = "", "-", Text(DateTimeValue(Text(h.Value.notified_at)), "yyyy/mm/dd hh:mm")), receivedAt:If(Text(h.Value.delivered_at) = "", "-", Text(DateTimeValue(Text(h.Value.delivered_at)), "yyyy/mm/dd hh:mm")), status:If(Text(h.Value.delivered_at) = "", "通知済み", "荷物受取済み"), staff:Text(h.Value.delivered_by), imageUrl:Text(h.Value.image_url), previewUrl:Text(h.Value.preview_url), imageBlobUrl:Text(h.Value.image_blob_url)})); Set(varHistTotal, Value(ParseJSON(varHistRaw).totalCount))
        );
        Set(varHistLoading, false);
        
        // ===== kiểm tra quyền — để CUỐI cùng =====
        //   Nếu connector PowerAppsforMakers chưa kết nối, chỉ khối này hỏng,
        //   dữ liệu và biến phía trên vẫn nạp bình thường.
        If(IsBlank(gblRoleAt) || !(gblMyRole in ["Owner", "CanEdit"]) || DateDiff(gblRoleAt, Now(), TimeUnit.Seconds) > 60, Set(gblMyRole, IfError(LookUp(PowerAppsforMakers.GetAppRoleAssignment(LookUp(PowerAppsforMakers.GetApps().value, Lower(Trim(properties.displayName)) = "eds-app-desktop-phase2").name).value, Lower(Trim(properties.principal.email)) = Lower(Trim(User().Email))).properties.roleName, "CanView"));Set(gblRoleAt, Now());)

