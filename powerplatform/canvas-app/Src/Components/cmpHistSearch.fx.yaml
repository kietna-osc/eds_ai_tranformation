    btnHsClear As modernButton:
        Appearance: =ButtonAppearance.Outline
        BasePaletteColor: =RGBA(0, 102, 204, 1)
        Color: =RGBA(0, 102, 204, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =App.Height * 0.04
        OnSelect: =Reset(txtHsSlip);Reset(txtHsRecipient);Reset(txtHsDept);Set(gblHsSlip, "");Set(gblHsRecipient, "");Set(gblHsDept, "");Set(gblHsStatus, "");Set(gblHsDType, "");Set(gblHsFrom, If(false, Now()));Set(gblHsTo, If(false, Now()));Set(gblHsDd, "")
        Size: =App.Height * 0.015
        Text: ="クリア"
        Visible: =gblHsOpen
        Width: =App.Width * 0.08
        X: =App.Width * 0.8
        Y: =App.Height * 0.115
        ZIndex: =25

    galHsStatusList As gallery.galleryVertical:
        BorderColor: =RGBA(203, 213, 225, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =App.Height * 0.108
        Items: =["", "通知済み", "受取済み"]
        Layout: =Layout.Vertical
        TemplateFill: =If(ThisItem.Value = gblHsStatus, RGBA(219, 234, 254, 1), RGBA(0, 0, 0, 0))
        TemplatePadding: =0
        TemplateSize: =App.Height * 0.036
        Visible: =gblHsDd = "status"
        Width: =App.Width * 0.13
        X: =App.Width * 0.085
        Y: =App.Height * 0.157
        ZIndex: =26

        btnHsStatusItem As modernButton:
            Align: =Align.Left
            Appearance: =ButtonAppearance.Transparent
            Color: =If(ThisItem.Value = gblHsStatus, RGBA(0, 102, 204, 1), RGBA(15, 23, 42, 1))
            Font: =Font.'Segoe UI'
            FontWeight: =If(ThisItem.Value = gblHsStatus, FontWeight.Bold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Set(gblHsStatus, ThisItem.Value);Set(gblHsDd, "")
            Size: =App.Height * 0.014
            Text: =If(IsBlank(ThisItem.Value), "すべて", ThisItem.Value)
            Width: =Parent.TemplateWidth
            ZIndex: =1

    galHsDTypeList As gallery.galleryVertical:
        BorderColor: =RGBA(203, 213, 225, 1)
        BorderThickness: =1
        Fill: =RGBA(255, 255, 255, 1)
        Height: =App.Height * 0.108
        Items: =["", "受取人指定あり", "指定なし（不明）"]
        Layout: =Layout.Vertical
        TemplateFill: =If(ThisItem.Value = gblHsDType, RGBA(219, 234, 254, 1), RGBA(0, 0, 0, 0))
        TemplatePadding: =0
        TemplateSize: =App.Height * 0.036
        Visible: =gblHsDd = "dtype"
        Width: =App.Width * 0.13
        X: =App.Width * 0.295
        Y: =App.Height * 0.157
        ZIndex: =27

        btnHsDTypeItem As modernButton:
            Align: =Align.Left
            Appearance: =ButtonAppearance.Transparent
            Color: =If(ThisItem.Value = gblHsDType, RGBA(0, 102, 204, 1), RGBA(15, 23, 42, 1))
            Font: =Font.'Segoe UI'
            FontWeight: =If(ThisItem.Value = gblHsDType, FontWeight.Bold, FontWeight.Normal)
            Height: =Parent.TemplateHeight
            OnSelect: =Set(gblHsDType, ThisItem.Value);Set(gblHsDd, "")
            Size: =App.Height * 0.014
            Text: =If(IsBlank(ThisItem.Value), "すべて", ThisItem.Value)
            Width: =Parent.TemplateWidth
            ZIndex: =1

