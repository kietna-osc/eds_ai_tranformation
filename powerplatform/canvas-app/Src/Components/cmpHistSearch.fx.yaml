    lblHsDType As label:
        BorderColor: =RGBA(203, 213, 225, 1)
        BorderThickness: =1
        Color: =If(IsBlank(gblHsDType), RGBA(148, 163, 184, 1), RGBA(15, 23, 42, 1))
        Fill: =RGBA(248, 250, 252, 1)
        Font: =Font.'Segoe UI'
        Height: =App.Height * 0.04
        HoverBorderColor: =RGBA(0, 102, 204, 1)
        OnSelect: =Set(gblHsDd, If(gblHsDd = "dtype", "", "dtype"))
        PaddingLeft: =10
        Size: =App.Height * 0.014
        Text: =If(IsBlank(gblHsDType), "データ区分を選択", gblHsDType)
        Visible: =gblHsOpen
        Width: =App.Width * 0.13
        X: =App.Width * 0.295
        Y: =App.Height * 0.115
        ZIndex: =21

    lblHsDTypeIco As label:
        Align: =Align.Center
        BorderColor: =RGBA(0, 0, 0, 0)
        Color: =RGBA(71, 85, 105, 1)
        Font: =Font.'Segoe UI'
        Height: =App.Height * 0.04
        OnSelect: =Set(gblHsDd, If(gblHsDd = "dtype", "", "dtype"))
        PaddingLeft: =0
        Size: =App.Height * 0.016
        Text: =If(gblHsDd = "dtype", "▴", "▾")
        Visible: =gblHsOpen
        Width: =App.Width * 0.02
        X: =App.Width * (0.295 + 0.13 - 0.022)
        Y: =App.Height * 0.115
        ZIndex: =22

    lblHsDeptCap As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        Color: =RGBA(71, 85, 105, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =App.Height * 0.04
        PaddingLeft: =0
        Size: =App.Height * 0.014
        Text: ="受取部署"
        Visible: =gblHsOpen
        Width: =App.Width * 0.055
        X: =App.Width * 0.45
        Y: =App.Height * 0.115
        ZIndex: =23

    txtHsDept As modernTextInput:
        Default: =gblHsDept
        Font: =Font.'Segoe UI'
        Height: =App.Height * 0.04
        OnChange: =Set(gblHsDept, Trim(Self.Text))
        Placeholder: ="部署名を入力"
        Visible: =gblHsOpen
        Width: =App.Width * 0.265
        X: =App.Width * 0.505
        Y: =App.Height * 0.115
