                        If(IsBlank(varEmpRaw) || Left(varEmpRaw, 8) = "{""error""", If(varShowNotifyFailed, Clear(colEmployees); Set(varEmpTotal, 0), Notify("社員一覧の取得に失敗しました", NotificationType.Error); Clear(colEmployees); Set(varEmpTotal, 0)), ClearCollect(colEmployees, ForAll(Table(ParseJSON(varEmpRaw).value) As emp, {no:0, empId:Text(emp.Value.employee_id), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:"", created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))})); Set(varEmpTotal, Value(ParseJSON(varEmpRaw).totalCount)))
                    )
                ),
                With({apiResult: IfError('EDS-APIManagement1'.Run("employee", JSON({employee_id: Trim(txtEmpFId.Text), full_name: Trim(txtEmpFName.Text), department_name: Trim(txtEmpFDept.Text), email: Trim(txtEmpFMail.Text)}), "employeeUpdate"), Blank())}, If(IsBlank(apiResult), Set(varNotifyErrorMessage, "Power Automate のフローに接続できません"); Set(varShowNotifyFailed, true); Set(varShowEmpInsertSuccess, false), Set(varEmpSuccessTitle, "更新しました"); Set(varEmpSuccessMessage, "従業員情報を更新しました。"); Set(varShowNotifyFailed, false); Set(varShowEmpInsertSuccess, true); Set(varShowEmpModal, false); Set(varEmpRaw, IfError(Substitute('EDS-APIManagement1'.Run("employee", "{""page"":" & gblPage & ",""pageSize"":" & gblPageSize & If(IsBlank(varEmpSearch), "", ",""search_keyword"":" & JSON(varEmpSearch)) & "}", "employeeList").response, ":null", ":"""""), "")); If(!(IsBlank(varEmpRaw) || Left(varEmpRaw, 8) = "{""error"""), ClearCollect(colEmployees, ForAll(Table(ParseJSON(varEmpRaw).value) As emp, {no:0, empId:Text(emp.Value.employee_id), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:"", created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))})); Set(varEmpTotal, Value(ParseJSON(varEmpRaw).totalCount)))))
            )
        Size: =App.Height * 0.015
