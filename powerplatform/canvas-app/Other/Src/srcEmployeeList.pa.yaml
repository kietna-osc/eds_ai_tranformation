      - btnEmpFetch:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(0, 102, 204, 1)
            BorderStyle: =
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =App.Height * .048
            OnSelect: |-
              =// 社員一覧の取得 (検索語の有無で取得方法が変わる。下記参照)
              Set(varEmpLoading, true);
              If(
                  IsBlank(varEmpSearch),
                  // 検索語なし: サーバー側ページング (page = gblPage, pageSize = gblPageSize)
                  Set(varEmpRaw, IfError(Substitute('EDS-APIManagement1'.Run("employee", "{""page"":" & gblPage & ",""pageSize"":" & gblPageSize & "}", "employeeList").response, ":null", ":"""""), ""));
                  If(
                      IsBlank(varEmpRaw) || Left(varEmpRaw, 8) = "{""error""",
                      Notify("社員一覧の取得に失敗しました", NotificationType.Error); Clear(colEmployees); Set(varEmpTotal, 0),
                      ClearCollect(colEmployees, ForAll(Table(ParseJSON(varEmpRaw).value) As emp, {no:Value(emp.Value.employee_id), empId:Text(emp.Value.employee_code), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:If(Boolean(emp.Value.is_active), "Active", "Inactive"), created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))})); Set(varEmpTotal, Value(ParseJSON(varEmpRaw).totalCount))
                  ),
                  // 検索語あり: 全件 (200 件ずつ) を取得して画面側で絞り込み・ページング (履歴画面と同じ)
                  Set(varEmpRaw, IfError(Substitute('EDS-APIManagement1'.Run("employee", "{""page"":1,""pageSize"":200}", "employeeList").response, ":null", ":"""""), ""));
                  If(
                      IsBlank(varEmpRaw) || Left(varEmpRaw, 8) = "{""error""",
                      Notify("社員一覧の取得に失敗しました", NotificationType.Error); Clear(colEmployees),
                      ClearCollect(colEmployees, ForAll(Table(ParseJSON(varEmpRaw).value) As emp, {no:Value(emp.Value.employee_id), empId:Text(emp.Value.employee_code), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:If(Boolean(emp.Value.is_active), "Active", "Inactive"), created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))}));
                      ForAll(
                          Sequence(Max(0, Value(ParseJSON(varEmpRaw).totalPages) - 1), 2) As pg,
                          With(
                              {pageRaw: IfError(Substitute('EDS-APIManagement1'.Run("employee", "{""page"":" & pg.Value & ",""pageSize"":200}", "employeeList").response, ":null", ":"""""), "")},
                              If(!(IsBlank(pageRaw) || Left(pageRaw, 8) = "{""error"""), Collect(colEmployees, ForAll(Table(ParseJSON(pageRaw).value) As emp, {no:Value(emp.Value.employee_id), empId:Text(emp.Value.employee_code), name:Text(emp.Value.full_name), email:Text(emp.Value.email), dept:Text(emp.Value.department_name), status:If(Boolean(emp.Value.is_active), "Active", "Inactive"), created:If(Text(emp.Value.created_at) = "", "", Text(DateTimeValue(Text(emp.Value.created_at)), "yyyy/mm/dd hh:mm")), updated:If(Text(emp.Value.updated_at) = "", "", Text(DateTimeValue(Text(emp.Value.updated_at)), "yyyy/mm/dd hh:mm"))})))
                          )
                      )
                  )
              );
              Set(varEmpLoading, false)
            Size: =App.Height * 0.015
            Text: ="検索"
            Visible: =false
            Width: =App.Width * .07
            X: =App.Width * .405
            Y: =App.Height * .117
