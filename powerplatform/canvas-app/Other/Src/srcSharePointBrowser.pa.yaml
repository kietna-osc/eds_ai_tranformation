                              AlignInContainer: =AlignInContainer.Stretch
                              BasePaletteColor: =RGBA(13, 148, 136, 1)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisplayMode: |-
                                =If(
                                    IsBlank(varSpPickedFolder) || CountRows(Filter(
                                        colSpAllItems As spItem,
                                        !spItem.'Is folder'
                                        && Text(spItem.'Folder path') = varSpPickedPath
                                        && IfError(Value(spItem.FileSizeBytes), 0) <= 4 * 1024 * 1024
                                        && Lower(Last(Split(Coalesce(Text(spItem.'File name with extension'), Text(spItem.Name)), ".")).Value) in ["jpg", "jpeg", "png", "gif", "bmp", "tif", "tiff", "heic", "heif", "webp"]
                                    )) = 0,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =App.Height * 0.064
                              OnSelect: |-
                                =ClearCollect(
                                    colSpFolderFiles,
                                    Filter(
                                        colSpAllItems As spItem,
                                        !spItem.'Is folder'
                                        && Text(spItem.'Folder path') = varSpPickedPath
                                        && IfError(Value(spItem.FileSizeBytes), 0) <= 4 * 1024 * 1024
                                        && Lower(Last(Split(Coalesce(Text(spItem.'File name with extension'), Text(spItem.Name)), ".")).Value) in ["jpg", "jpeg", "png", "gif", "bmp", "tif", "tiff", "heic", "heif", "webp"]
                                    )
                                );
                                Set(varBatchTotal, CountRows(colSpFolderFiles));
                                Set(varProcessedCount, 0);
                                ClearCollect(
                                    colHomeQueue,
                                    ForAll(
                                        colSpFolderFiles As f,
                                        With(
                                            {
                                                fname: Coalesce(Text(f.'File name with extension'), Text(f.Name)),
                                                fdir: If(Right(Text(f.'Folder path'), 1) = "/", Text(f.'Folder path'), Text(f.'Folder path') & "/")
                                            },
                                            With(
                                                { full: If(Left(fdir, 1) = "/", fdir, "/" & fdir) & fname },
                                                {
                                                    id: Text(GUID()),
                                                    name: fname,
                                                    source: "sharepoint",
                                                    image: IfError(f.Thumbnail.Large, SampleImage),
                                                    path: full,
                                                    file_url: Substitute(full, " ", "%20"),
                                                    folder: varSpPickedFolder,
                                                    processed: false
                                                }
                                            )
                                        )
                                    )
                                );
                                With(
                                    { nextItem: First(colHomeQueue) },
                                    Set(varHomeSelectedId, nextItem.id);
                                    Set(varImage, Coalesce(nextItem.image, SampleImage));
                                    Set(varImageUrl, "");
                                    Set(varImageName, If(!IsBlank(nextItem.path), "SPPATH|" & nextItem.path, Coalesce(nextItem.name, "label.jpg")))
                                );
                                ClearCollect(varCandidates, []);
                                ClearCollect(colSelected, []);
                                ClearCollect(colSpSelected, []);
                                Clear(colSpFolderFiles);
                                Set(varSpFolderName, "");
                                Set(varSpFolderPath, "");
                                Set(varSpPickedFolder, "");
                                Set(varSpPickedPath, "");
                                Set(varError, "");
