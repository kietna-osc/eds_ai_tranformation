              //   検索語があればサーバー側で絞り込み (伝票番号・受取人・処理状況・データ区分・通知日時)。ページングもサーバー側
              Set(varHistLoading, true);
              Set(varHistRaw, IfError(With({apiResult: 'EDS-APIManagement1'.Run("history", "{""page"":" & gblPage & ",""pageSize"":" & gblPageSize & If(IsBlank(varHistSearch), "", ",""search_keyword"":" & JSON(varHistSearch) & ",""tz_offset"":" & TimeZoneOffset()) & "}", "historyList")}, If(!IsBlank(Trim(Coalesce(Text(apiResult.error), ""))), Set(varNotifyErrorMessage, Text(apiResult.error)); Set(varShowNotifyFailed, true); "", Set(varShowNotifyFailed, false); IfError(Substitute(apiResult.response, ":null", ":"""""), ""))), Set(varNotifyErrorMessage, "Power Automate のフローに接続できません"); Set(varShowNotifyFailed, true); ""));
                  If(
                      IsBlank(varHistRaw) || Left(varHistRaw, 8) = "{""error""",
                      If(varShowNotifyFailed, false, Notify("履歴の取得に失敗しました", NotificationType.Error)); Clear(colHistory); Set(varHistTotal, 0),
                      ClearCollect(colHistory, ForAll(Table(ParseJSON(varHistRaw).value) As h, {no:Value(h.Value.history_id), dataType:If(Lower(Trim(Coalesce(Text(h.Value.data_type), Text(h.Value.status)))) = "identified", "受取人指定あり", "指定なし（不明）"), slip:Text(h.Value.slip_no), item:Text(h.Value.sender_content), sender:Text(h.Value.sender_name), senderAddr:Text(h.Value.sender_address), recipient:If(Text(h.Value.recipient_name) = "", "不明", Text(h.Value.recipient_name)), dept:Text(h.Value.recipient_department_name), deliveredAt:If(Text(h.Value.notified_at) = "", "-", Text(DateTimeValue(Text(h.Value.notified_at)), "yyyy/mm/dd hh:mm")), receivedAt:If(Text(h.Value.delivered_at) = "", "-", Text(DateTimeValue(Text(h.Value.delivered_at)), "yyyy/mm/dd hh:mm")), status:If(Text(h.Value.delivered_at) <> "" || Lower(Trim(Text(h.Value.status))) = "delivered", "受取済み", "通知済み"), staff:Text(h.Value.delivered_by), imageUrl:Text(h.Value.image_url), previewUrl:Text(h.Value.preview_url), imageBlobUrl:Text(h.Value.image_blob_url)})); Set(varHistTotal, Value(ParseJSON(varHistRaw).totalCount))
                  );
              Set(varHistLoading, false)
            Size: =App.Height * 0.015
            Text: ="検索"
            Visible: =false
            Width: =App.Width * .07
            X: =App.Width * .405
            Y: =App.Height * .117
