      - btnHistFetch:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(0, 102, 204, 1)
            BorderStyle: =
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =App.Height * .048
            OnSelect: |-
              =// 履歴の取得
              //   検索語なし: サーバー側ページング (page = gblPage, pageSize = gblPageSize)
              //   検索語あり: historyList にキーワード条件が無いため、全ページ (200 件ずつ) を取得して画面側で絞り込み・ページング
              Set(varHistLoading, true);
              If(
                  IsBlank(varHistSearch),
                  Set(varHistRaw, IfError(Substitute('EDS-APIManagement1'.Run("history", "{""page"":" & gblPage & ",""pageSize"":" & gblPageSize & "}", "historyList").response, ":null", ":"""""), ""));
                  If(
                      IsBlank(varHistRaw) || Left(varHistRaw, 8) = "{""error""",
                      Notify("履歴の取得に失敗しました", NotificationType.Error); Clear(colHistory); Set(varHistTotal, 0),
                      ClearCollect(colHistory, ForAll(Table(ParseJSON(varHistRaw).value) As h, {no:Value(h.Value.history_id), dataType:If(Text(h.Value.status) = "Identified", "受取人指定あり", "受取人不明"), slip:Text(h.Value.slip_no), item:Text(h.Value.sender_content), sender:Text(h.Value.sender_name), senderAddr:Text(h.Value.sender_address), recipient:If(Text(h.Value.recipient_name) = "", "不明", Text(h.Value.recipient_name)), dept:Text(h.Value.recipient_department_name), deliveredAt:If(Text(h.Value.notified_at) = "", "-", Text(DateTimeValue(Text(h.Value.notified_at)), "yyyy/mm/dd hh:mm")), receivedAt:If(Text(h.Value.delivered_at) = "", "-", Text(DateTimeValue(Text(h.Value.delivered_at)), "yyyy/mm/dd hh:mm")), status:If(Text(h.Value.delivered_at) = "", "通知済み", "荷物受取済み"), staff:Text(h.Value.delivered_by), imageUrl:Text(h.Value.image_url), previewUrl:Text(h.Value.preview_url), imageBlobUrl:Text(h.Value.image_blob_url)})); Set(varHistTotal, Value(ParseJSON(varHistRaw).totalCount))
                  ),
                  Set(varHistRaw, IfError(Substitute('EDS-APIManagement1'.Run("history", "{""page"":1,""pageSize"":200}", "historyList").response, ":null", ":"""""), ""));
                  If(
                      IsBlank(varHistRaw) || Left(varHistRaw, 8) = "{""error""",
                      Notify("履歴の取得に失敗しました", NotificationType.Error); Clear(colHistory),
                      ClearCollect(colHistory, ForAll(Table(ParseJSON(varHistRaw).value) As h, {no:Value(h.Value.history_id), dataType:If(Text(h.Value.status) = "Identified", "受取人指定あり", "受取人不明"), slip:Text(h.Value.slip_no), item:Text(h.Value.sender_content), sender:Text(h.Value.sender_name), senderAddr:Text(h.Value.sender_address), recipient:If(Text(h.Value.recipient_name) = "", "不明", Text(h.Value.recipient_name)), dept:Text(h.Value.recipient_department_name), deliveredAt:If(Text(h.Value.notified_at) = "", "-", Text(DateTimeValue(Text(h.Value.notified_at)), "yyyy/mm/dd hh:mm")), receivedAt:If(Text(h.Value.delivered_at) = "", "-", Text(DateTimeValue(Text(h.Value.delivered_at)), "yyyy/mm/dd hh:mm")), status:If(Text(h.Value.delivered_at) = "", "通知済み", "荷物受取済み"), staff:Text(h.Value.delivered_by), imageUrl:Text(h.Value.image_url), previewUrl:Text(h.Value.preview_url), imageBlobUrl:Text(h.Value.image_blob_url)}));
                      ForAll(
                          Sequence(Max(0, Value(ParseJSON(varHistRaw).totalPages) - 1), 2) As pg,
                          With(
                              {pageRaw: IfError(Substitute('EDS-APIManagement1'.Run("history", "{""page"":" & pg.Value & ",""pageSize"":200}", "historyList").response, ":null", ":"""""), "")},
                              If(!(IsBlank(pageRaw) || Left(pageRaw, 8) = "{""error"""), Collect(colHistory, ForAll(Table(ParseJSON(pageRaw).value) As h, {no:Value(h.Value.history_id), dataType:If(Text(h.Value.status) = "Identified", "受取人指定あり", "受取人不明"), slip:Text(h.Value.slip_no), item:Text(h.Value.sender_content), sender:Text(h.Value.sender_name), senderAddr:Text(h.Value.sender_address), recipient:If(Text(h.Value.recipient_name) = "", "不明", Text(h.Value.recipient_name)), dept:Text(h.Value.recipient_department_name), deliveredAt:If(Text(h.Value.notified_at) = "", "-", Text(DateTimeValue(Text(h.Value.notified_at)), "yyyy/mm/dd hh:mm")), receivedAt:If(Text(h.Value.delivered_at) = "", "-", Text(DateTimeValue(Text(h.Value.delivered_at)), "yyyy/mm/dd hh:mm")), status:If(Text(h.Value.delivered_at) = "", "通知済み", "荷物受取済み"), staff:Text(h.Value.delivered_by), imageUrl:Text(h.Value.image_url), previewUrl:Text(h.Value.preview_url), imageBlobUrl:Text(h.Value.image_blob_url)})))
                          )
                      )
                  )
              );
              Set(varHistLoading, false)
            Size: =App.Height * 0.015
            Text: ="検索"
            Visible: =false
            Width: =App.Width * .07
            X: =App.Width * .405
            Y: =App.Height * .117
