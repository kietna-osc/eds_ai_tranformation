            Color: =RGBA(0, 102, 204, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =App.Height * 0.036
            OnSelect: =Set(gblHsOpen, !gblHsOpen);Set(gblHsDd, "")
