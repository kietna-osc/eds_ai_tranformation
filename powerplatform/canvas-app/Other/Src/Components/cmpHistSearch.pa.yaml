            Fill: =RGBA(248, 250, 252, 1)
            Font: =Font.'Segoe UI'
            Height: =App.Height * 0.04
            HoverBorderColor: =RGBA(0, 102, 204, 1)
            OnSelect: |-
              =Set(gblHsDd, "");Set(gblCalVal, gblHsFrom);Set(gblCalMonth, With({b: Coalesce(gblHsFrom, Now())}, DateTime(Year(b), Month(b), 1, 0, 0, 0)));Set(gblCalX, 0.505);Set(gblCalY, 0.217);Set(gblCalTarget, "histFrom")
            PaddingLeft: =10
            Size: =App.Height * 0.014
            Text: =If(IsBlank(gblHsFrom), "開始日時を選択", Text(gblHsFrom, "yyyy/mm/dd hh:mm"))
