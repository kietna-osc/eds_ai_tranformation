ComponentDefinitions:
  cmpHistSearch:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    Properties:
      Height: =180
      Width: =1366
    Children:
      - recHsBackdrop:
          Control: Rectangle@2.3.0
