            Width: =App.Width * 0.13
            X: =App.Width * 0.085
            Y: =App.Height * 0.157
          Children:
            - btnHsStatusItem:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Left
                  Appearance: =ButtonAppearance.Transparent
                  BorderStyle: =
                  Color: =If(ThisItem.Value = gblHsStatus, RGBA(0, 102, 204, 1), RGBA(15, 23, 42, 1))
